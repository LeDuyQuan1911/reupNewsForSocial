name: CI sandbox

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-tests:
    name: Python tests (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      REUP_AUTO_ENABLED: '0'
      REUP_FACEBOOK_AUTH_MODE: page_token
      REUP_FACEBOOK_PAGE_ID: ''
      REUP_FACEBOOK_PAGE_TOKEN: ''
      REUP_FACEBOOK_SYSTEM_USER_TOKEN: ''
      REUP_LLM_API_KEY: ''
      REUP_LLM_MODEL: ''
      REUP_LLM_VISION_MODEL: ''
      REUP_LLM_IMAGE_MODEL: ''
      REUP_SECRET_KEY: ci-test-only
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run isolated tests
        run: python -m unittest discover -s tests -v
      - name: Smoke check dashboard with temporary database
        run: python scripts/cd/smoke.py
