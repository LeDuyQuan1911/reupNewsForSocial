<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}reupNewsForSocial{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('dashboard') }}"><span class="brand-mark">R</span><span>reupNewsForSocial</span></a>
    <span class="mode">Bản chạy trên máy cá nhân</span>
  </header>
  <div class="app-layout">
    <nav class="app-nav" aria-label="Điều hướng chính">
      <a class="{{ 'active' if request.endpoint == 'dashboard' else '' }}" href="{{ url_for('dashboard') }}" {% if request.endpoint == 'dashboard' %}aria-current="page"{% endif %}>Tổng quan</a>
      <a class="{{ 'active' if request.endpoint in ['articles_page', 'article_detail'] else '' }}" href="{{ url_for('articles_page') }}" {% if request.endpoint in ['articles_page', 'article_detail'] %}aria-current="page"{% endif %}>Bài báo</a>
      <a class="{{ 'active' if request.endpoint == 'workflow_page' else '' }}" href="{{ url_for('workflow_page') }}" {% if request.endpoint == 'workflow_page' %}aria-current="page"{% endif %}>Luồng đăng</a>
      <a class="{{ 'active' if request.endpoint in ['posts_page', 'edit_post'] else '' }}" href="{{ url_for('posts_page') }}" {% if request.endpoint in ['posts_page', 'edit_post'] %}aria-current="page"{% endif %}>Bài đăng</a>
      <a class="{{ 'active' if request.endpoint == 'sources_page' else '' }}" href="{{ url_for('sources_page') }}" {% if request.endpoint == 'sources_page' %}aria-current="page"{% endif %}>Nguồn thông tin</a>
      <a class="{{ 'active' if request.endpoint == 'account_page' else '' }}" href="{{ url_for('account_page') }}" {% if request.endpoint == 'account_page' %}aria-current="page"{% endif %}>Tài khoản</a>
    </nav>
    <main class="shell {% block shell_class %}{% endblock %}">
      {% for category, message in get_flashed_messages(with_categories=true) %}<div class="notice {{ category }}" role="status">{{ message }}</div>{% endfor %}
      {% block content %}{% endblock %}
    </main>
  </div>
</body>
</html>
